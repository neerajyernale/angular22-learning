<div class="container-fluid py-3">
    <div class="row g-3">
        @for (emp of employees(); track emp.id) {
            <div class="col-sm-6 col-xl-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-white border-bottom-0 pt-3 pb-0">
                        <h5 class="card-title mb-1">{{emp.name}}</h5>
                        <p class="text-muted mb-0">{{emp.email}}</p>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <span class="badge bg-light text-dark">{{emp.department}}</span>
                        </div>
                        <p class="mb-2"><span class="text-muted">Designation:</span> {{emp.designation}}</p>
                        <p class="mb-0"><span class="text-muted">Salary:</span> ₹{{emp.salary}}</p>
                    </div>
                    <div class="card-footer bg-white d-flex justify-content-between">
                        <button class="btn btn-outline-primary btn-sm " (click)="onedit(emp)">Edit</button>
                        <button class="btn btn-outline-danger btn-sm " (click)="onRemove(emp.id)">Delete</button>
                    </div>
                </div>
            </div>
        } @empty {
            <div class="col-12">
                <div class="alert alert-info mb-0" >No employee found.</div>
            </div>
        }
    </div>
</div>
