<div class="container">
    <div class="row">

        <div class="col-md-4">
            <app-employee-form
            [employee]="selectedEmployee()"
            (employeeCreated)="empCreated($event)"
            (employeeUpdated)="empUpdate($event)"
            ></app-employee-form>
        </div>

        <div class="col-md-8">
            <app-employee-card
                [employees]="EmployeeService.employees()"
                (editEmployee)="editemp($event)"
                (removeEmployee)="removeemp($event)"
                >
                
            </app-employee-card>
        </div>

    </div>
</div>
